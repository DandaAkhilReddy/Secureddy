[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reddysec"
version = "0.1.0"
description = "Secureddy: an inbox bodyguard. Checks every link and file in a sandbox before you see it."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Akhil Reddy Danda" }]
keywords = ["email security", "phishing", "sandbox", "gmail", "outlook", "yahoo", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "cryptography>=42",
  "PyJWT[crypto]>=2.8",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "tldextract>=5",
  "dnspython>=2.6",
  "oletools>=0.60",
  "pymupdf>=1.24",
  "playwright>=1.45",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.130",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "structlog>=24",
  "python-dotenv>=1.0",
  "email-validator>=2.1",
  "pyzipper>=0.3.6",
  "nh3>=0.2.17",
  "webauthn>=2.0",
]

[project.urls]
Homepage = "https://github.com/DandaAkhilReddy/Secureddy"
Source = "https://github.com/DandaAkhilReddy/Secureddy"
Issues = "https://github.com/DandaAkhilReddy/Secureddy/issues"
Security = "https://github.com/DandaAkhilReddy/Secureddy/security/policy"

[project.optional-dependencies]
# asyncpg: the "postgres" tests run against a real PostgreSQL when one is
# available (see tests/postgres/conftest.py) and skip cleanly otherwise.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "aiosmtpd>=1.4", "ruff>=0.5", "asyncpg>=0.30",
       "cbor2>=5", "pre-commit>=3"]
azure = [
  "azure-identity>=1.16",
  "azure-mgmt-containerinstance>=10.1",
  "azure-keyvault-secrets>=4.8",
  "azure-storage-blob>=12.20",
  "azure-servicebus>=7.12",
  "asyncpg>=0.30",
]

[project.scripts]
reddysec = "reddysec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reddysec = ["web/templates/*.html", "web/templates/**/*.html", "web/static/*", "web/static/**/*", "chamber/static/*", "chamber/*.json", "analysis/data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "integration: runs a real browser or local servers; slower",
  "slow: takes more than a few seconds",
  "postgres: needs a real PostgreSQL (RS_TEST_POSTGRES_URL, or initdb on PATH / /usr/lib/postgresql); skipped otherwise",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["reddysec"]
branch = true
# SQLAlchemy's async layer switches greenlets inside awaits; without this the
# C tracer silently drops the rest of such frames and under-reports coverage.
concurrency = ["thread", "greenlet"]
omit = ["*/testing/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]
