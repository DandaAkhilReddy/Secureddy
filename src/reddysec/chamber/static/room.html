<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Room</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel-2:#171b25; --line:#242a38;
    --ink:#e8ecf4; --ink-dim:#9aa4b8; --ink-faint:#626d82;
    --accent:#6ea8fe; --accent-ink:#0b0d12; --warn:#ffb84d; --warn-bg:#2a2112;
    --danger:#ff6b6b; --ok:#54d6a0; --radius:10px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto;min-height:56px}
  .brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px;user-select:none}
  .brand b{font-size:13px;letter-spacing:.2px}
  .brand span{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1.2px}
  .nav{display:flex;gap:4px}
  button,.btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;transition:.12s;line-height:1}
  button:hover:not(:disabled),.btn:hover{border-color:#36405a;background:#1c2130}
  button:disabled{opacity:.4;cursor:not-allowed}
  .icon{width:34px;padding:7px 0;text-align:center;font-size:14px}
  .url{flex:1;min-width:60px;display:flex;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px}
  .url .lock{color:var(--ink-faint);font-size:12px}
  .url input{flex:1;background:transparent;border:0;color:var(--ink);font-family:var(--mono);
    font-size:12.5px;outline:none;min-width:0}
  .url input::placeholder{color:var(--ink-faint)}
  .danger{color:var(--danger);border-color:#3a2330}
  .danger:hover{background:#2a1820;border-color:#5a3340}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;position:relative;background:#06070a;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:100%;background:#06070a;cursor:default;touch-action:none}
  .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;color:var(--ink-dim);background:rgba(6,7,10,.86);text-align:center;padding:24px;z-index:5}
  .veil.hidden{display:none}
  .spinner{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .side{flex:0 0 288px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .side h2{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink-faint);
    margin:0;padding:14px 16px 8px}
  .warnbox{padding:0 12px;display:flex;flex-direction:column;gap:8px}
  .warn{background:var(--warn-bg);border:1px solid #4a3a16;border-left:3px solid var(--warn);
    border-radius:8px;padding:10px 12px;font-size:12.5px;color:#ffd79a;animation:slide .2s ease}
  .warn b{color:var(--warn);display:block;margin-bottom:2px;font-size:12px}
  @keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .dls{flex:1;overflow-y:auto;padding:4px 12px 12px}
  .dl{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .dl .fn{font-size:12.5px;word-break:break-all;margin-bottom:3px}
  .dl .meta{font-size:11px;color:var(--ink-faint);font-family:var(--mono);margin-bottom:8px}
  .dl a.get{display:inline-block;font-size:12px;text-decoration:none;color:var(--accent-ink);
    background:var(--accent);border-radius:7px;padding:6px 10px;font-weight:600}
  .dl a.get:hover{filter:brightness(1.08)}
  .dl .pending{font-size:11.5px;color:var(--warn);display:flex;align-items:center;gap:6px}
  .dl .nope{font-size:11.5px;color:var(--ink-faint)}
  .dl .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .empty{color:var(--ink-faint);font-size:12px;padding:6px 4px}
  footer{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);
    border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);font-family:var(--mono)}
  .status{display:flex;align-items:center;gap:7px}
  .led{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);transition:.2s}
  .led.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .led.off{background:var(--danger)}
  .grow{flex:1}
  @media (max-width:720px){
    .side{position:fixed;right:0;top:56px;bottom:0;width:280px;transform:translateX(100%);
      transition:.2s;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
    .side.open{transform:none}
    .brand{display:none}
  }
  .panel-toggle{display:none}
  @media (max-width:720px){.panel-toggle{display:block}}
</style>
</head>
<body>
  <div class="bar">
    <div class="brand"><b>Reading Room</b><span>Isolated browser</span></div>
    <div class="nav">
      <button class="icon" id="back" title="Back" aria-label="Back">&#8592;</button>
      <button class="icon" id="forward" title="Forward" aria-label="Forward">&#8594;</button>
      <button class="icon" id="reload" title="Reload" aria-label="Reload">&#8635;</button>
    </div>
    <form class="url" id="go" autocomplete="off">
      <span class="lock" id="lock" title="Connection">&#9679;</span>
      <input id="addr" type="text" spellcheck="false" placeholder="Go to an address" aria-label="Current address">
    </form>
    <button class="panel-toggle icon" id="toggle" title="Downloads" aria-label="Downloads">&#9776;</button>
    <button class="danger" id="close">Close room</button>
  </div>

  <main>
    <div class="stage">
      <canvas id="screen" width="1280" height="800" tabindex="0" aria-label="Isolated page view"></canvas>
      <div class="veil" id="veil"><div class="spinner"></div><div id="veiltext">Opening a clean browser on our servers&hellip;</div></div>
    </div>
    <aside class="side" id="side">
      <h2>Safety</h2>
      <div class="warnbox" id="warnbox"></div>
      <h2>Downloads</h2>
      <div class="dls" id="dls"><div class="empty">Files you download appear here as safe PDF copies.</div></div>
    </aside>
  </main>

  <footer>
    <div class="status"><span class="led" id="led"></span><span id="statetext">connecting&hellip;</span></div>
    <div class="grow"></div>
    <span id="hint">pixels only &middot; nothing runs on your device</span>
  </footer>

<script>
"use strict";
const SESSION_ID = __SESSION_ID__;
const $ = (id) => document.getElementById(id);
const canvas = $("screen"), ctx = canvas.getContext("2d", {alpha:false});
const addr = $("addr"), led = $("led"), stateText = $("statetext"), veil = $("veil"), veilText = $("veiltext");
const dls = $("dls"), warnbox = $("warnbox");

let ws = null, connected = false, closed = false, gotFrame = false;
let frameW = canvas.width, frameH = canvas.height;
const img = new Image();
let pendingSrc = null, drawing = false;
const downloads = new Map();          // index -> record
const warnedCodes = new Set();

// ---- websocket ---------------------------------------------------------------
function wsUrl(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}/room/${SESSION_ID}/ws`;
}
function connect(){
  ws = new WebSocket(wsUrl());
  ws.onopen = () => { connected = true; setStatus(true, "connected"); };
  ws.onclose = () => {
    connected = false; setStatus(false, closed ? "room closed" : "disconnected");
    if (!closed) setTimeout(connect, 1200);     // transient drop: retry
  };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
  ws.onmessage = (ev) => { try { onMessage(JSON.parse(ev.data)); } catch(e){} };
}
function send(obj){ if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onMessage(m){
  switch(m.t){
    case "frame": onFrame(m); break;
    case "url": if (document.activeElement !== addr) addr.value = m.url; break;
    case "title": document.title = (m.title ? m.title + " · " : "") + "Reading Room"; break;
    case "state": applyState(m); break;
    case "download": onDownload(m); break;
    case "warning": onWarning(m); break;
    case "closed": onClosed(m); break;
    case "pong": break;
  }
}

// ---- frame rendering (DPR-aware) ---------------------------------------------
function onFrame(m){
  if (!gotFrame){ gotFrame = true; veil.classList.add("hidden"); }
  if (m.w && m.h && (m.w !== frameW || m.h !== frameH)){ frameW = m.w; frameH = m.h; resizeCanvas(); }
  pendingSrc = "data:image/jpeg;base64," + m.b64;
  if (!drawing) paint();
}
function paint(){
  if (!pendingSrc) return;
  drawing = true;
  const src = pendingSrc; pendingSrc = null;
  img.onload = () => {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    if (pendingSrc) paint(); else drawing = false;
  };
  img.onerror = () => { drawing = false; };
  img.src = src;
}
function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(frameW * dpr);
  canvas.height = Math.round(frameH * dpr);
  canvas.style.aspectRatio = frameW + " / " + frameH;
}

// ---- coordinate mapping ------------------------------------------------------
function toPage(ev){
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * frameW;
  const y = (ev.clientY - r.top) / r.height * frameH;
  return {x: Math.max(0, Math.min(frameW, x)), y: Math.max(0, Math.min(frameH, y))};
}
const BTN = {0:"left",1:"middle",2:"right"};

canvas.addEventListener("mousemove", throttle((ev) => { const p = toPage(ev); send({t:"mouse",action:"move",x:p.x,y:p.y}); }, 40));
canvas.addEventListener("mousedown", (ev) => { ev.preventDefault(); canvas.focus(); const p = toPage(ev); send({t:"mouse",action:"down",x:p.x,y:p.y,button:BTN[ev.button]||"left"}); });
canvas.addEventListener("mouseup", (ev) => { ev.preventDefault(); const p = toPage(ev); send({t:"mouse",action:"up",x:p.x,y:p.y,button:BTN[ev.button]||"left"}); });
canvas.addEventListener("dblclick", (ev) => { ev.preventDefault(); const p = toPage(ev); send({t:"mouse",action:"dblclick",x:p.x,y:p.y,button:"left"}); });
canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
canvas.addEventListener("wheel", (ev) => { ev.preventDefault(); const p = toPage(ev); send({t:"mouse",action:"wheel",x:p.x,y:p.y,deltaX:ev.deltaX,deltaY:ev.deltaY}); }, {passive:false});

// keyboard: only when the canvas holds focus, and we swallow the browser default
canvas.addEventListener("keydown", (ev) => {
  if (ev.metaKey || (ev.ctrlKey && !["c","v","x","a"].includes(ev.key.toLowerCase()))) return; // let real browser shortcuts through
  ev.preventDefault();
  const text = (ev.key.length === 1) ? ev.key : null;
  send({t:"key",action:"press",key:ev.key,text:text});
});

// ---- navigation controls -----------------------------------------------------
$("go").addEventListener("submit", (ev) => { ev.preventDefault(); const u = addr.value.trim(); if (u){ send({t:"nav",url:u}); canvas.focus(); } });
$("back").onclick = () => send({t:"back"});
$("forward").onclick = () => send({t:"forward"});
$("reload").onclick = () => send({t:"reload"});
$("close").onclick = () => { closeRoom(); };
$("toggle").onclick = () => $("side").classList.toggle("open");

async function closeRoom(){
  closed = true;
  try { await fetch(`/room/${SESSION_ID}/close`, {method:"POST"}); } catch(e){}
  try { ws && ws.close(); } catch(e){}
  showVeil("You closed this reading room. It is safe to close this tab.");
}

// ---- downloads + warnings ----------------------------------------------------
function applyState(m){
  if (m.url && document.activeElement !== addr) addr.value = m.url;
  if (m.state === "closed" || m.state === "error") onClosed({reason: m.state});
  (m.downloads || []).forEach(onDownload);
}
function onDownload(m){ downloads.set(m.index, m); renderDownloads(); }
function renderDownloads(){
  if (downloads.size === 0){ dls.innerHTML = '<div class="empty">Files you download appear here as safe PDF copies.</div>'; return; }
  const items = [...downloads.entries()].sort((a,b) => a[0]-b[0]);
  dls.innerHTML = items.map(([i, d]) => {
    const meta = `${d.sniffed_type || "file"} · ${fmtSize(d.size)}`;
    let action;
    if (d.safe_ready) action = `<a class="get" href="/room/${SESSION_ID}/download/${i}/safe">Get safe copy (PDF)</a>`;
    else if (d.reason) action = `<div class="nope">No safe copy: ${esc(d.reason)}</div>`;
    else action = `<div class="pending"><span class="dot"></span>Preparing safe copy&hellip;</div>`;
    return `<div class="dl"><div class="fn">${esc(d.filename)}</div><div class="meta">${esc(meta)}</div>${action}</div>`;
  }).join("");
}
const WARN_TEXT = {
  password_on_unknown_host: (m) => ["Password on an unknown site", `You are typing a password on <b>${esc(m.host)}</b>, which we don't recognise as a known sign-in site. If you did not mean to sign in here, stop.`],
  navigation_failed: (m) => ["Could not open the page", esc(m.detail || m.url || "")],
  download_failed: (m) => ["Download failed", esc(m.filename || m.detail || "")],
  download_limit: (m) => ["Download limit reached", "This room will not keep more files."],
};
function onWarning(m){
  const make = WARN_TEXT[m.code];
  if (!make) return;
  if (m.code === "password_on_unknown_host" && warnedCodes.has("pw:"+m.host)) return;
  if (m.code === "password_on_unknown_host") warnedCodes.add("pw:"+m.host);
  const [title, body] = make(m);
  const el = document.createElement("div");
  el.className = "warn"; el.innerHTML = `<b>${title}</b>${body}`;
  warnbox.prepend(el);
  $("side").classList.add("open");
  if (m.code !== "password_on_unknown_host") setTimeout(() => el.remove(), 9000);
}
function onClosed(m){
  closed = true; setStatus(false, "room closed");
  showVeil(m && m.reason ? `This room has closed: ${m.reason}.` : "This room has closed.");
  try { ws && ws.close(); } catch(e){}
}

// ---- misc --------------------------------------------------------------------
function setStatus(on, text){
  led.className = "led " + (on ? "on" : "off");
  stateText.textContent = text;
  $("lock").style.color = on ? "var(--ok)" : "var(--ink-faint)";
  [...document.querySelectorAll(".nav button, #close")].forEach(b => b.disabled = closed);
}
function showVeil(text){ veilText.innerHTML = text; veil.querySelector(".spinner").style.display = "none"; veil.classList.remove("hidden"); }
function fmtSize(n){ if (!n) return "0 B"; const u=["B","KB","MB","GB"]; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?1:0)+" "+u[i]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function throttle(fn, ms){ let last=0; return (...a) => { const t=Date.now(); if (t-last>=ms){ last=t; fn(...a); } }; }

let resizeTimer = null;
function reportSize(){
  const r = canvas.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if (w > 0 && h > 0) send({t:"resize", w, h});
}
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(reportSize, 300); });
setInterval(() => send({t:"ping"}), 25000);     // keep the socket warm

resizeCanvas();
connect();
canvas.focus();
</script>
</body>
</html>
