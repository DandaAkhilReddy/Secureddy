<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Room</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --line:#242a38; --ink:#e8ecf4;
    --ink-dim:#9aa4b8; --ink-faint:#626d82; --accent:#6ea8fe; --accent-ink:#0b0d12;
    --danger:#ff6b6b; --danger-bg:#241319; --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(1000px 600px at 50% -10%, #141926 0%, var(--bg) 60%);
    color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink-faint);margin:0 0 6px}
  h1{font-size:22px;margin:0 0 8px;letter-spacing:.2px}
  p.lead{color:var(--ink-dim);font-size:14px;line-height:1.5;margin:0 0 22px}
  form{display:flex;flex-direction:column;gap:12px}
  label{font-size:12px;color:var(--ink-dim)}
  input[type=url],input[type=text]{width:100%;background:#171b25;border:1px solid var(--line);
    border-radius:10px;padding:13px 14px;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none;transition:.12s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.15)}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
    padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s}
  button:hover{filter:brightness(1.07)}
  .err{background:var(--danger-bg);border:1px solid #4a2630;border-left:3px solid var(--danger);
    color:#ffb3b3;border-radius:10px;padding:11px 13px;font-size:13px;margin:0 0 18px}
  .err:empty{display:none}
  .note{display:flex;gap:9px;align-items:flex-start;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--ink-faint);font-size:12px;line-height:1.5}
  .note svg{flex:0 0 auto;margin-top:1px}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Secureddy</p>
    <h1>Open a link safely</h1>
    <p class="lead">We open the address in a clean browser on our servers and stream only the picture to you. Nothing from the page runs on your device.</p>
    <div class="err">__ERROR__</div>
    <form method="post" action="/room/start">
      <label for="url">Address to open</label>
      <input id="url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://example.com/document" value="__URL__" autofocus required>
      <button type="submit">Open in Reading Room</button>
    </form>
    <div class="note">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 2.5 4v3.5c0 3.2 2.3 5.6 5.5 6.9 3.2-1.3 5.5-3.7 5.5-6.9V4L8 1.5Z" stroke="#626d82" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span>Links are never opened on your own computer. Downloads are cleaned into a safe PDF before you can save them.</span>
    </div>
  </div>
</body>
</html>
