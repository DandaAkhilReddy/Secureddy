<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Install the CLI - Docs</title></head>
<body>
  <h1>Install the command line tool</h1>
  <p>Open PowerShell and paste the following command, then press Enter:</p>
  <pre><code>iwr https://get.example-tool.dev/install.ps1 -UseBasicParsing | iex</code></pre>
  <button class="copy-button" onclick="navigator.clipboard.writeText('iwr https://get.example-tool.dev/install.ps1 -UseBasicParsing | iex')">Copy</button>
  <p>On macOS, open Terminal and run <code>/bin/bash -c "$(curl -fsSL https://get.example-tool.dev/install.sh)"</code>.</p>
</body>
</html>
